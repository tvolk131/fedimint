[package]
authors = { workspace = true }
description = "fedimint-bolt12-client is a Fedimint user client module for federated BOLT12 offline receives."
edition = { workspace = true }
license = { workspace = true }
name = "fedimint-bolt12-client"
version = { workspace = true }

[features]
cli = ["dep:clap"]
default = []

[lib]
name = "fedimint_bolt12_client"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bitcoin = { workspace = true }
clap = { workspace = true, optional = true }
erased-serde = { workspace = true }
fedimint-api-client = { workspace = true }
fedimint-bolt12-common = { workspace = true }
fedimint-client-module = { workspace = true }
fedimint-core = { workspace = true }
fedimint-derive-secret = { workspace = true }
fedimint-eventlog = { workspace = true }
fedimint-ln-common = { workspace = true }
fedimint-logging = { workspace = true }
futures = { workspace = true }
lightning = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tpe = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
