[package]
authors = { workspace = true }
description = "Experimental Simplicity contract module: client"
edition = { workspace = true }
license = { workspace = true }
name = "fedimint-simplicity-client"
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[features]
# Client-side examples only; no additional guardian primitives or wire types.
ptlc = ["dep:schnorr_fun", "dep:sha2"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bitcoin = { workspace = true }
erased-serde = { workspace = true }
fedimint-aead = { workspace = true }
fedimint-api-client = { workspace = true }
fedimint-client-module = { workspace = true }
fedimint-core = { workspace = true }
fedimint-derive-secret = { workspace = true }
fedimint-simplicity-common = { workspace = true, features = ["compiler"] }
futures = { workspace = true }
rand = { workspace = true }
schnorr_fun = { workspace = true, optional = true, features = ["serde"] }
serde = { workspace = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
clap = { workspace = true, features = ["derive"] }
fedimint-bip39 = { workspace = true }
fedimint-client = { workspace = true }
fedimint-connectors = { workspace = true }
fedimint-mintv2-client = { workspace = true }
fedimint-rocksdb = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
